# Alpine (musl) on every architecture it has, natively or under QEMU.
# A push runs this workflow unless its commit message has [ci:...] tags and this group is not among them ([ci:bsd] runs only the BSDs; [ci:bsd][ci:macos] those two);
# [ci:loong64] runs only the loongarch64 job of this one; [skip ci] skips every workflow.  A push that changes only documents does not run it.  "Run workflow" in the Actions tab starts it by hand, whatever the message.
name: ci-alpine

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'decus/**'
      - 'oracle/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'decus/**'
      - 'oracle/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# a new push cancels the runs of this workflow still going for the same branch (the QEMU jobs are slow; the result for a replaced commit is of no use)
concurrency:
  group: ci-alpine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Alpine (musl, gcc 15) on every 64 bit architecture it has: natively where the
  # runner is that architecture, else under QEMU user mode, as ada-on-alpine does.
  # the back end is LLVM (llvm-dev from apk)
  alpine:
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, '[ci:') || contains(github.event.head_commit.message, '[ci:alpine]') || (contains(github.event.head_commit.message, '[ci:loong64]') && matrix.arch == 'loong64')"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64,   runner: ubuntu-latest,    qemu: false}
          - {arch: arm64,   runner: ubuntu-24.04-arm, qemu: false}
          - {arch: ppc64le, runner: ubuntu-latest,    qemu: true}
          - {arch: riscv64, runner: ubuntu-latest,    qemu: true}
          - {arch: s390x,   runner: ubuntu-latest,    qemu: true}
          - {arch: loong64, runner: ubuntu-latest,    qemu: true}
          - {arch: 386,     runner: ubuntu-latest,    qemu: false}
          - {arch: arm/v7,  runner: ubuntu-latest,    qemu: true}
    # the job as a whole may take longer than any stage, and a stage has its own limit: one that hangs is stopped by the limit of its step, and the steps after it (the work kept,
    # the summary, the logs) still run
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      # the work of the stages (the copy of the tree, the build, the logs) is kept: a run again of the same commit goes on from the stages that finished, and make from its objects
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: work
          key: alpine-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: alpine-${{ matrix.arch }}-${{ github.sha }}-
      # the logs of every step, setup included, are files from here on (work/logs/setup.log), which are uploaded whatever happens
      - run: |
          mkdir -p work/logs
          { echo "== $(date -u +%FT%TZ) ${{ matrix.arch }} on ${{ matrix.runner }}, commit ${{ github.sha }}, attempt ${{ github.run_attempt }}"; uname -srm; docker version --format 'docker {{.Server.Version}}'; df -h . | tail -1; free -m | sed -n 2p; ls work | tr '\n' ' '; echo; } >> work/logs/setup.log 2>&1
      - if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      # Docker's alpine image has no loongarch64: import Alpine's minirootfs.  The emulator is the one setup-qemu registered; if that one does not run it, qemu-user-static of the
      # system (its apt step fails by itself on a runner image that has dropped a package, so it is only the second try, and the failure says which step it was)
      - if: matrix.arch == 'loong64'
        timeout-minutes: 15
        run: |
          exec > >(tee -a work/logs/setup.log) 2>&1
          set -u
          base=https://dl-cdn.alpinelinux.org/alpine/edge/releases/loongarch64
          file=$(curl -sf $base/latest-releases.yaml | awk '/file: alpine-minirootfs/ {print $2; exit}')
          [ -n "$file" ] || { echo "::error::no minirootfs for loongarch64 in $base"; exit 1; }
          curl -sfO "$base/$file" || { echo "::error::cannot fetch $base/$file"; exit 1; }
          docker import --platform linux/loong64 "$file" alpine-loongarch64:edge || { echo "::error::docker import of $file failed"; exit 1; }
          if ! docker run --rm --platform linux/loong64 alpine-loongarch64:edge uname -m; then
            echo "::warning::setup-qemu did not give a loongarch64 emulator; trying qemu-user-static of the system"
            sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static || { echo "::error::apt could not install qemu-user-static"; exit 1; }
            docker run --rm --platform linux/loong64 alpine-loongarch64:edge uname -m || { echo "::error::no emulator runs loongarch64"; exit 1; }
          fi
      # the emulators that are registered, for the log (the setup action's own output is not readable afterwards)
      - if: matrix.qemu
        run: |
          { echo "binfmt: $(ls /proc/sys/fs/binfmt_misc | grep -i qemu | tr '\n' ' ')"; for f in /proc/sys/fs/binfmt_misc/qemu-*; do [ -r "$f" ] && { echo "-- $f"; head -3 "$f"; }; done; } >> work/logs/setup.log 2>&1 || true
      - name: build
        timeout-minutes: 90
        run: tools/ci-arch.sh ${{ matrix.arch }} build ${{ matrix.make }}
        env: {CI_WORK: "${{ github.workspace }}/work", IMAGE: "${{ matrix.arch == 'loong64' && 'alpine-loongarch64:edge' || 'alpine:edge' }}"}
      - name: check
        timeout-minutes: 180
        run: tools/ci-arch.sh ${{ matrix.arch }} check ${{ matrix.make }}
        env: {CI_WORK: "${{ github.workspace }}/work", IMAGE: "${{ matrix.arch == 'loong64' && 'alpine-loongarch64:edge' || 'alpine:edge' }}"}
      - name: link
        timeout-minutes: 30
        run: tools/ci-arch.sh ${{ matrix.arch }} link ${{ matrix.make }}
        env: {CI_WORK: "${{ github.workspace }}/work", IMAGE: "${{ matrix.arch == 'loong64' && 'alpine-loongarch64:edge' || 'alpine:edge' }}"}
      # whatever happened, the work stays for the next run and the logs for whoever reads this one (the container made the files as root: the cache cannot read them)
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" work 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ strategy.job-index }}-${{ matrix.arch == 'arm/v7' && 'armv7' || matrix.arch }}
          path: work/logs
          if-no-files-found: ignore
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: work
          key: alpine-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        run: |
          for f in work/logs/*.status; do [ -f "$f" ] && echo "$(basename $f .status): $(cat $f)"; done >> "$GITHUB_STEP_SUMMARY"
          for f in work/logs/*.log work/logs/*.heartbeat; do [ -f "$f" ] || continue; { echo "### $(basename $f)"; echo '```'; tail -n 30 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; done
