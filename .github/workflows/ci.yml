name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # amd64: pcc's code generator and the C back end, all the tests
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: make
      - run: make check

  # arm64: the C back end (pcc does not work on aarch64 yet)
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: make
      - run: make check

  # macOS on Apple silicon: the C back end; the stage 1 test needs ELF objcopy
  # and is skipped
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: make
        run: |
          set +e
          make > /tmp/make.log 2>&1
          rc=$?
          if [ $rc != 0 ]; then
            echo "::error::make failed: $(grep -i -B1 -A3 'error\|undefined\|not found' /tmp/make.log | head -c 1500 | tr '\n%' ' _')"
            exit $rc
          fi
      - name: make check
        run: |
          set +e
          make check > /tmp/check.log 2>&1
          rc=$?
          if [ $rc != 0 ]; then
            echo "::error::make check failed: $(grep -i -B2 -A2 'fail\|error\|not found' /tmp/check.log | head -c 1800 | tr '\n%' ' _')"
            exit $rc
          fi

  # Alpine (musl, gcc 15) on every 64 bit architecture it has: natively where the
  # runner is that architecture, else under QEMU user mode, as ada-on-alpine does.
  # x86_64 also builds pcc's cc1 against musl; the others use the C back end.
  alpine:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64,   runner: ubuntu-latest,    qemu: false}
          - {arch: arm64,   runner: ubuntu-24.04-arm, qemu: false}
          - {arch: ppc64le, runner: ubuntu-latest,    qemu: true}
          - {arch: riscv64, runner: ubuntu-latest,    qemu: true}
          - {arch: s390x,   runner: ubuntu-latest,    qemu: true}
          - {arch: loong64, runner: ubuntu-latest,    qemu: true}
          - {arch: 386,     runner: ubuntu-latest,    qemu: false, make: 'WITH_PCC=yes PCCCONF=--build=i686-pc-linux-musl'}
          - {arch: arm/v7,  runner: ubuntu-latest,    qemu: true,  make: 'WITH_PCC=yes PCCCONF=--build=arm-unknown-linux-musleabihf'}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - if: matrix.qemu && matrix.arch != 'loong64'
        uses: docker/setup-qemu-action@v3
      # Docker's alpine image has no loongarch64: import Alpine's minirootfs
      - if: matrix.arch == 'loong64'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          base=https://dl-cdn.alpinelinux.org/alpine/edge/releases/loongarch64
          file=$(curl -sf $base/latest-releases.yaml | awk '/file: alpine-minirootfs/ {print $2; exit}')
          curl -sfO "$base/$file"
          docker import --platform linux/loong64 "$file" alpine-loongarch64:edge
      - run: tools/ci-arch.sh ${{ matrix.arch }} ${{ matrix.make }}
        env:
          IMAGE: ${{ matrix.arch == 'loong64' && 'alpine-loongarch64:edge' || 'alpine:edge' }}

  # FreeBSD, in a VM: the C back end (pcc's cc1 is built where it is supported)
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y gmake binutils python3
          run: |
            gmake WITH_PCC=no
            gmake WITH_PCC=no check

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: vmactions/netbsd-vm@v1
        with:
          prepare: /usr/sbin/pkg_add gmake python312 || /usr/sbin/pkg_add gmake
          run: |
            gmake WITH_PCC=no
            gmake WITH_PCC=no check

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: vmactions/openbsd-vm@v1
        with:
          prepare: pkg_add gmake python3
          run: |
            gmake WITH_PCC=no
            gmake WITH_PCC=no check

  # the Debian package, built from the source package it makes
  debian-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y build-essential debhelper binutils python3
      - name: build the package
        run: |
          set +e
          dpkg-buildpackage -us -uc -b > /tmp/dpkg.log 2>&1
          rc=$?
          if [ $rc != 0 ]; then
            echo "::error::dpkg-buildpackage failed ($rc): $(tail -c 1500 /tmp/dpkg.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit $rc
          fi
      - run: dpkg-deb -I ../imp72_*_amd64.deb
      - run: sudo dpkg -i ../imp72_*_amd64.deb
      - name: compile and run a program with the installed package
        run: |
          imp72stage0 -o /tmp/hello tests/native/hello.imp
          /tmp/hello
          imp72stage0 -C -o /tmp/hello_c tests/native/hello.imp
          /tmp/hello_c
