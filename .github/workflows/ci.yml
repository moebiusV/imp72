name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # amd64: the LLVM back end, all the tests
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make check

  # arm64: the LLVM back end
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make check

  # macOS on Apple silicon: the LLVM back end (Homebrew's llvm); the stage 1 test needs ELF objcopy
  # and is skipped
  macos-arm64:
    runs-on: macos-14
    env:
      LLVM_CONFIG: /opt/homebrew/opt/llvm/bin/llvm-config
    steps:
      - uses: actions/checkout@v4
      - run: brew install llvm
      - name: make
        run: |
          set +e
          make > /tmp/make.log 2>&1
          rc=$?
          if [ $rc != 0 ]; then
            echo "::error::make failed: $(grep -i -B1 -A3 'error\|undefined\|not found' /tmp/make.log | head -c 1500 | tr '\n%' ' _')"
            exit $rc
          fi
      - name: make check
        run: |
          set +e
          make check > /tmp/check.log 2>&1
          rc=$?
          if [ $rc != 0 ]; then
            echo "::error::make check failed: $(grep -i -B2 -A2 'fail\|error\|not found' /tmp/check.log | head -c 1800 | tr '\n%' ' _')"
            exit $rc
          fi

  # Alpine (musl, gcc 15) on every 64 bit architecture it has: natively where the
  # runner is that architecture, else under QEMU user mode, as ada-on-alpine does.
  # the back end is LLVM (llvm-dev from apk)
  alpine:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64,   runner: ubuntu-latest,    qemu: false}
          - {arch: arm64,   runner: ubuntu-24.04-arm, qemu: false}
          - {arch: ppc64le, runner: ubuntu-latest,    qemu: true}
          - {arch: riscv64, runner: ubuntu-latest,    qemu: true}
          - {arch: s390x,   runner: ubuntu-latest,    qemu: true}
          - {arch: loong64, runner: ubuntu-latest,    qemu: true}
          - {arch: 386,     runner: ubuntu-latest,    qemu: false}
          - {arch: arm/v7,  runner: ubuntu-latest,    qemu: true}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.qemu && matrix.arch != 'loong64'
        uses: docker/setup-qemu-action@v3
      # Docker's alpine image has no loongarch64: import Alpine's minirootfs
      - if: matrix.arch == 'loong64'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          base=https://dl-cdn.alpinelinux.org/alpine/edge/releases/loongarch64
          file=$(curl -sf $base/latest-releases.yaml | awk '/file: alpine-minirootfs/ {print $2; exit}')
          curl -sfO "$base/$file"
          docker import --platform linux/loong64 "$file" alpine-loongarch64:edge
      - run: tools/ci-arch.sh ${{ matrix.arch }} ${{ matrix.make }}
        env:
          IMAGE: ${{ matrix.arch == 'loong64' && 'alpine-loongarch64:edge' || 'alpine:edge' }}

  # FreeBSD, in a VM: the LLVM back end
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y gmake binutils python3 llvm
          run: |
            gmake
            gmake check

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          prepare: /usr/sbin/pkg_add gmake python312 llvm || /usr/sbin/pkg_add gmake llvm
          run: |
            gmake
            gmake check

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          prepare: pkg_add gmake python3 llvm
          run: |
            if ! (gmake && gmake check) > /tmp/o.log 2>&1; then
              echo "::error::openbsd failed: $(grep -i -B2 -A2 'error\|fail\|not found\|undefined' /tmp/o.log | head -c 1800 | tr '\n%' ' _')"
              echo "::error::openbsd tail: $(tail -c 800 /tmp/o.log | tr '\n%' ' _')"
              ( set +e; uname -srm; objcopy --version | head -1; stage0/imp72s0 -c /tmp/x.0 decus/syntax.imc tests/native/hello.imp; echo "rc0=$?"; ls -l /tmp/x.0 ) > /tmp/d.log 2>&1
              echo "::error::openbsd diag: $(head -c 1800 /tmp/d.log | tr '\n%' ' _')"
              exit 2
            fi

  # the Debian package, built from the source package it makes
  debian-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential debhelper binutils python3 llvm-dev liblld-dev
      - name: build the package
        run: |
          set +e
          dpkg-buildpackage -us -uc -b > /tmp/dpkg.log 2>&1
          rc=$?
          if [ $rc != 0 ]; then
            echo "::error::dpkg-buildpackage failed ($rc): $(tail -c 1500 /tmp/dpkg.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit $rc
          fi
      - run: dpkg-deb -I ../imp72_*_amd64.deb
      - run: sudo dpkg -i ../imp72_*_amd64.deb
      - name: compile and run a program with the installed package
        run: |
          imp72stage0 -o /tmp/hello tests/native/hello.imp
          /tmp/hello
