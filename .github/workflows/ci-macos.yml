# macOS on Apple silicon.
# A push runs this workflow unless its commit message has [ci:...] tags and this group is not among them ([ci:bsd] runs only the BSDs; [ci:bsd][ci:macos] those two);
# [skip ci] skips every workflow.  A push that changes only documents does not run it.  "Run workflow" in the Actions tab starts it by hand, whatever the message.
name: ci-macos

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'decus/**'
      - 'oracle/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'decus/**'
      - 'oracle/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# a new push cancels the runs of this workflow still going for the same branch (the QEMU jobs are slow; the result for a replaced commit is of no use)
concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS on Apple silicon: the LLVM back end (Homebrew's llvm and lld)
  macos-arm64:
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, '[ci:') || contains(github.event.head_commit.message, '[ci:macos]')"
    runs-on: macos-15
    env:
      LLVM_CONFIG: /opt/homebrew/opt/llvm/bin/llvm-config
    steps:
      - uses: actions/checkout@v6
      - run: brew install llvm lld
      - name: make
        run: |
          set +e
          make > "$RUNNER_TEMP/make.log" 2>&1
          rc=$?
          if [ $rc != 0 ]; then
            echo "::error::make failed: $(grep -i -B1 -A3 'error\|undefined\|not found' "$RUNNER_TEMP/make.log" | head -c 1500 | tr '\n%' ' _')"
            echo "::error::macos make tail: $(tail -c 1500 "$RUNNER_TEMP/make.log" | tr '\n%' ' _')"
            # the logs of the stages (the seed's compiles of the modules, the link): what the step that failed said
            for f in build/llvm-ir1.log build/llvm-ir2.log build/llvm-ir1/*.log build/llvm-ir2/*.log; do
              [ -s "$f" ] && echo "::error::macos $f: $(head -c 700 "$f" | tr '\n%' ' _') ... $(tail -c 700 "$f" | tr '\n%' ' _')"
            done
            exit $rc
          fi
      - name: make check
        run: |
          set +e
          make check > "$RUNNER_TEMP/check.log" 2>&1
          rc=$?
          if [ $rc != 0 ]; then
            echo "::error::make check failed: $(grep -i -B2 -A2 'fail\|error\|not found' "$RUNNER_TEMP/check.log" | head -c 1800 | tr '\n%' ' _')"
            # what the commands of tests/cli say (its test sends it to /dev/null)
            ( cd build/cli 2>/dev/null && w=$PWD/../llvm-ir2/impstage-llvm-ir && export IMPSYNTAX=$PWD/../../src/llvm-ir/syntax.imc IMPFFI=$PWD/../../lib/ffi.imc IMPLIB=$PWD/../lib/libimp.a
              for c in "-S lib2.imp -o d1.s" "-c --target=aarch64-linux-gnu lib2.imp -o d2.o" "-c --target=riscv64-linux-gnu lib2.imp -o d3.o" "-c --target=x86_64-linux-gnu lib2.imp -o d4.o"; do
                o=$(echo "$c" | sed 's/.* -o //'); rm -f "$o"
                m=$($w $c 2>&1 | head -c 400 | tr '\n%' ' _'); r=$?
                echo "::error::macos cli [$c]: $m | file: $(od -An -tx1 -N24 "$o" 2>&1 | tr '\n%' ' _') | $($w --version 2>&1 | head -c 80)"
              done ) || true
            exit $rc
          fi
      - if: always()
        run: |
          sh tools/ci-host.sh macos
          echo "::notice::macos flags: $(sh tools/llvm.sh cflags | tr '\n%' ' _' | cut -c1-500) LIBS: $(sh tools/llvm.sh libs | tr '\n%' ' _' | cut -c1-400)"
          echo "::notice::macos link test: $(sh tests/link/run.sh 2>&1 | tr '\n%' ' _' | cut -c1-600)"
