; Boot TOPS-10 6.03 unattended.  The date is 1979 because 6.03 is not Y2K safe.
do common.ini
expect "\r\n" send "SYSTEM\r"; continue
expect "WHY RELOAD:" send "SCHED\r"; continue
expect "DATE:" send "%DATE_MMM%-%DATE_DD%-79\r"; continue
expect "TIME:" send "%TIME_HH%%TIME_MM%\r"; continue
expect "STARTUP OPTION" send "QUICK\r"; continue
boot dpa
