; maintenance boot of the KI10 from the system tape (to install the boot block on the disks)
set env PORT 10603
set cpu 512k idle
at dpa0 disks-ki/ki_dskb0.rp3
at dpa1 disks-ki/ki_dskb1.rp3
at dpa2 disks-ki/ki_dskb2.rp3
at dpa3 disks-ki/ki_dskb3.rp3
at lpt -n units/printer-ki.txt
set mta type=b
at mta0 -r tapes-ki/kidp_system.tap
set dc modem=8
at dc %PORT%
expect "BTM>" send "system.exe[1,4]\r"; continue
expect "RELOAD:" send "SCHED\r"; continue
expect "DATE:" send "%DATE_MMM%-%DATE_DD%-79\r"; continue
expect "TIME:" send "%TIME_HH%%TIME_MM%\r"; continue
expect "STARTUP OPTION:" send "QUICK\r"; continue
boot mta0
