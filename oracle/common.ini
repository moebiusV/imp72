; TOPS-10 v6.03 on the SIMH KA10 (disks from the PiDP-10 project, see PROVENANCE.md)
set env PORT 10603
set cpu 256k idle
at dpa0 disks/ka_dskb0.rp3
at dpa1 disks/ka_dskb1.rp3
at dpa2 disks/ka_dskb2.rp3
at dpa3 disks/ka_dskb3.rp3
at lpt -n units/printer.txt
at mta0 tapes/in.tap
at -r mta1 tapes/decus3.tap
set cr disable
set mta type=b
set dc modem=8
at dc %PORT%
set debug ../build/oracle/mta.log
set mta debug=cmd;detail;pos
